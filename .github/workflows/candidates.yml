name: candidates

# 毎朝 7:30（日本時間）に Instagram のフォロー候補リストを Issue で届ける（フォロー自体はしない）
on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 候補を集める
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/candidates.py > body.md
      - name: 前日までの候補Issueを閉じて、今日のIssueを作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create candidates --color 0e8a16 --description "フォロー候補" 2>/dev/null || true
          for n in $(gh issue list --label candidates --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "新しい候補リストに入れ替えました" >/dev/null
          done
          gh issue create --title "フォロー候補 $(TZ=Asia/Tokyo date +%m/%d)" --label candidates --body-file body.md
