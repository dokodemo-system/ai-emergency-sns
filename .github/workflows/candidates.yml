name: candidates

# claude/posts に candidates/*.md が追加されたら、その内容を Issue にして届ける（メール通知が飛ぶ）
on:
  push:
    branches: [claude/posts]
    paths: ["candidates/**"]
  workflow_dispatch:
    inputs:
      file:
        description: "Issueにする候補ファイル（例: candidates/2026-09-30.md）"
        required: true

permissions:
  contents: read
  issues: write

jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 追加された候補ファイルを Issue にする
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.file }}" ]; then
            FILES="${{ github.event.inputs.file }}"
            [ -f "$FILES" ] || { mkdir -p candidates; git show "origin/claude/posts:$FILES" > "$FILES"; }
          else
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git merge-base origin/main HEAD)
          fi
          FILES=$(git diff --name-only --diff-filter=A "$BEFORE" "${{ github.sha }}" -- 'candidates/*.md')
          fi
          [ -z "$FILES" ] && { echo "新しい候補なし"; exit 0; }
          gh label create candidates --color 0e8a16 --description "フォロー候補" 2>/dev/null || true
          for n in $(gh issue list --label candidates --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "新しい候補リストに入れ替えました" >/dev/null
          done
          for f in $FILES; do
            d=$(basename "$f" .md)
            # ボットが作ったIssueは通知が飛ばないことがあるため、担当者に指定＋メンションで通知を確実にする
            { echo "@${{ github.repository_owner }} 今日のフォロー候補です。"; echo; cat "$f"; } > body.md
            gh issue create --title "フォロー候補 $d" --label candidates --assignee "${{ github.repository_owner }}" --body-file body.md
          done
