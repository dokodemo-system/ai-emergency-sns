name: uchida-run

# 【試作】内田さん向け SNS自動投稿の1回分を動かす（uchida-demo ブランチのみ）。
# - demo/run.txt が変わったら：スプシを読み、設定（毎日入れる／自動で作る）に従って動く
# - posts-uchida/*/post.json が変わったら（自動で作るの中身を Claude が書いたら）：画像を作って投稿する
# 投稿先は設定で選んだもの（Instagram・X・Threads。公式LINE は試作ではイメージ）。結果はスプシの実行ログへ。
on:
  push:
    branches: [uchida-demo]
    paths: ["demo/run.txt", "posts-uchida/**/post.json"]

concurrency: publish

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 道具の準備（画像書き出し・日本語フォント）
        run: |
          pip install -q requests requests-oauthlib playwright pillow
          python -m playwright install --with-deps chromium > /dev/null
          sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: 実行
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          UCHIDA_GAS_URL: ${{ secrets.UCHIDA_GAS_URL }}
          UCHIDA_TOKEN: ${{ secrets.UCHIDA_TOKEN }}
          PYTHONPATH: scripts
        run: python scripts/uchida_ci.py "${{ github.event.before }}" "${{ github.sha }}"
